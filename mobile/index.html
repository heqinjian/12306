<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 移动端视口，viewport-fit=cover 用于适配刘海屏安全区域 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>12306 手机端 - 下导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Helvetica Neue", "Microsoft YaHei", sans-serif;
      background-color: #f5f6f8;
      color: #333;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== 页面演示内容（用于演示固定下导航的滚动效果）===== */
    .page {
      /* 底部留出下导航的高度，避免内容被遮挡 */
      padding-bottom: calc(60px + env(safe-area-inset-bottom));
    }

    .page-header {
      background-color: #1296db;
      color: #fff;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }

    .placeholder {
      background-color: #fff;
      margin: 12px;
      padding: 24px 16px;
      border-radius: 8px;
      font-size: 15px;
      color: #888;
      line-height: 1.6;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    /* ===== 下导航（Tab Bar）=====
       1. position: fixed 固定在视口底部（12306 下导航为固定效果）
       2. flex 布局让 5 个导航项平分宽度，实现自适应宽度
       3. SVG 图标使用 currentColor，颜色由 CSS 控制 */
    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      width: 100%;
      height: 60px;
      background-color: #ffffff;
      border-top: 1px solid #e8e8e8;
      /* 适配 iPhone 等全面屏底部安全区域 */
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.05);
    }

    /* 每个导航项：flex:1 平分宽度，内容水平垂直居中 */
    .tabbar__item {
      flex: 1 1 0;
      min-width: 0;               /* 允许收缩，保证 5 项在窄屏平分宽度 */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 3px;
      color: #333333;            /* 未选中：深灰色 */
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.2s;
      user-select: none;
    }

    /* SVG 图标尺寸：固定宽高，大小由 CSS 控制 */
    .tabbar__icon {
      display: block;
      width: 26px;
      height: 26px;
      fill: currentColor;         /* 图标颜色跟随文字颜色 */
    }

    /* 选中态：12306 主题蓝 */
    .tabbar__item.active {
      color: #1296db;
    }

    /* 点击反馈 */
    .tabbar__item:active {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!-- 页面内容（演示用） -->
  <main class="page">
    <header class="page-header">12306 手机端下导航演示</header>
    <div class="placeholder">页面内容区域：上下滚动页面，底部导航始终固定显示。</div>
    <div class="placeholder">导航项使用 SVG 图标（fill: currentColor），通过 CSS 控制大小与颜色。</div>
    <div class="placeholder">五个导航项通过 flex:1 平分屏幕宽度，随视口宽度自适应。</div>
    <div class="placeholder">占位内容</div>
    <div class="placeholder">占位内容</div>
    <div class="placeholder">占位内容</div>
    <div class="placeholder">占位内容</div>
    <div class="placeholder">占位内容</div>
  </main>

  <script>
    // 点击导航项切换选中态（演示交互）
    var items = document.querySelectorAll('.tabbar__item');
    items.forEach(function (item) {
      item.addEventListener('click', function () {
        items.forEach(function (i) { i.classList.remove('active'); });
        item.classList.add('active');
      });
    });
  </script>
