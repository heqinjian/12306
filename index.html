<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国铁路12306 · 站点入口</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Helvetica Neue", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #eaf4ff 0%, #f5f6f8 60%);
      color: #222;
      padding: 24px;
    }
    .brand { text-align: center; margin-bottom: 36px; }
    .brand h1 { font-size: 26px; color: #1296db; letter-spacing: 1px; }
    .brand p { margin-top: 8px; color: #666; font-size: 14px; }
    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }
    .card {
      flex: 1 1 260px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 16px;
      padding: 32px 24px;
      text-decoration: none;
      color: inherit;
      text-align: center;
      box-shadow: 0 6px 18px rgba(18, 150, 219, 0.08);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 26px rgba(18, 150, 219, 0.16);
    }
    .card .icon {
      width: 56px; height: 56px;
      margin: 0 auto 16px;
      border-radius: 14px;
      background: #eaf4ff;
      display: flex; align-items: center; justify-content: center;
    }
    .card .icon svg { width: 30px; height: 30px; fill: #1296db; }
    .card h2 { font-size: 18px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #777; line-height: 1.6; }
    .card .go {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 22px;
      border-radius: 20px;
      background: #1296db;
      color: #fff;
      font-size: 14px;
    }
    .footer { margin-top: 36px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="brand">
    <h1>中国铁路 12306</h1>
    <p>请选择要访问的站点版本</p>
  </div>

  <div class="cards">
    <a class="card" href="web/index.html">
      <div class="icon">
        <!-- 电脑端图标 -->
        <svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-7v2h3v2H7v-2h3v-2H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v8h16V7H4z"/></svg>
      </div>
      <h2>电脑端 Web</h2>
      <p>桌面浏览器访问，完整功能页面</p>
      <span class="go">进入电脑端</span>
    </a>

    <a class="card" href="mobile/index.html">
      <div class="icon">
        <!-- 手机端图标 -->
        <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1.5 3v14h7V5h-7zm2 12.5h3v1h-3v-1z"/></svg>
      </div>
      <h2>移动端 Mobile</h2>
      <p>手机浏览器访问，底部导航页面</p>
      <span class="go">进入移动端</span>
    </a>
  </div>

  <div class="footer">高级网页设计 I · 图像解决方案 课程作业</div>
</body>
</html>
